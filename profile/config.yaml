# profile/config.yaml

# General snakemake parameters
use-conda: true
use-singularity: true
use-envmodules: true
printshellcmds: true
latency-wait: 100 
conda-frontend: mamba
rerun-incomplete: true 
jobs: 3
local-cores: 1 
nolock: true

# Slurm parameters
slurm: true

# Default slurm resources
default-resources:
  - slurm_account=esnitkin1
  - slurm_partition=standard
  - runtime=90
  - mem_mb=5000 
  - slurm_extra="--mail-type=BEGIN,FAIL,END --mail-user=kgontjes@umich.edu --output=slurm_out/slurm-%j.out --error=slurm_out/slurm-%j.err"

# Config
configfile: config/config.yaml